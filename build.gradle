plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}

group = 'com.diggydwarff.deepdiving'

version = mod_version

base {
    archivesName = 'create-deep-diving-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'bundledIllumination'
                url = uri('libs/maven')
            }
        }
        filter {
            includeModule('com.breadres', 'illuminationapi')
        }
    }

    maven {
        url = 'https://maven.createmod.net'
    }

    maven {
        url = 'https://maven.ithundxr.dev/snapshots'
    }

    mavenCentral()
}

dependencies {
    if (project.hasProperty('mekanismQa')) {
        runtimeOnly fileTree(dir: 'qa-libs', include: ['Mekanism-*.jar'])
    }
    if (project.hasProperty('graphicsQa')) {
        runtimeOnly fileTree(dir: 'qa-libs/graphics', include: ['*.jar'])
    }
    if (project.hasProperty('sodiumQa')) {
        runtimeOnly fileTree(dir: 'qa-libs/graphics-latest', include: ['sodium-*.jar'])
    }
    // Original upstream 1.0 JAR, pinned locally for reproducible Jar-in-Jar builds.
    // The API's public MIT text and original metadata are preserved in META-INF/licenses.
    jarJar(implementation('com.breadres:illuminationapi')) {
        version {
            strictly '[1.0]'
            prefer '1.0'
        }
    }

    implementation("com.simibubi.create:create-1.21.1:${create_version}:slim") {
        transitive = false
    }

    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc1.21.1"

    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:${flywheel_version}"

    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:${flywheel_version}"

    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
}

neoForge {
    version = project.neo_version

    runs {
        configureEach {
            gameDirectory = project.file("run/${name}")
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        deepdiving {
            sourceSet sourceSets.main
        }
    }
}

// Expand release metadata without hard-coding the version in the mod descriptor.
tasks.withType(ProcessResources).configureEach {
    inputs.property 'mod_version', mod_version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: mod_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// QA helpers compile against the mod but stay outside the production JAR.
sourceSets {
    qa {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath

        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

def clientProbeReportName = { project.hasProperty('hudQa') ? 'hud-qa-results.txt' : project.hasProperty('rc1Qa') ? 'rc1-refinement-results.txt' : project.hasProperty('configQa') ? 'config-qa-results.txt' : project.hasProperty('polishQa') ? 'polish-qa-results.txt' : project.hasProperty('beta3Qa') ? 'beta3-visual-results.txt' : project.hasProperty('panelQa') ? 'panel-qa-results.txt' : project.hasProperty('siteQa') ? 'site-qa-results.txt' : project.hasProperty('worldQa') ? 'world-qa-results.txt' : 'visual-qa-results.txt' }

if (project.hasProperty('qa')) {
    neoForge.mods.deepdiving.sourceSet sourceSets.qa

    neoForge.runs.server.systemProperty 'deepdiving.qa', 'true'

    // A failed startup must never pass using a report left by an earlier run.
    tasks.named('runServer') {
        doFirst {
            delete layout.projectDirectory.file('run/server/qa-results.txt')
        }
    }

    if (project.hasProperty('creativeQa')) {
        neoForge.runs.server.systemProperty 'deepdiving.creativeQa', 'true'
    }

    neoForge.runs.client.systemProperty 'deepdiving.visualQa', 'true'

    tasks.named('runClient') {
        doFirst {
            def report = project.file("run/client/${clientProbeReportName()}")
            if (report.exists() && !report.delete()) throw new GradleException("Could not clear old QA report: ${report}")
        }
    }

    neoForge.runs.client.programArguments.addAll(
            '--width', (findProperty('qaWidth') ?: '1280').toString(),
            '--height', (findProperty('qaHeight') ?: '900').toString())

    if (project.hasProperty('worldQa')) {
        neoForge.runs.client.systemProperty 'deepdiving.visualQa', 'false'
        neoForge.runs.client.systemProperty 'deepdiving.worldQa', 'true'
    }

    if (project.hasProperty('siteQa')) {
        neoForge.runs.client.systemProperty 'deepdiving.visualQa', 'false'
        neoForge.runs.client.systemProperty 'deepdiving.siteQa', 'true'
    }

    if (project.hasProperty('panelQa')) {
        neoForge.runs.client.systemProperty 'deepdiving.visualQa', 'false'
        neoForge.runs.client.systemProperty 'deepdiving.panelQa', 'true'
    }

    if (project.hasProperty('beta3Qa')) {
        neoForge.runs.client.systemProperty 'deepdiving.visualQa', 'false'
        neoForge.runs.client.systemProperty 'deepdiving.beta3Qa', 'true'
    }

    if (project.hasProperty('polishQa')) {
        neoForge.runs.client.systemProperty 'deepdiving.visualQa', 'false'
        neoForge.runs.client.systemProperty 'deepdiving.polishQa', 'true'
    }

    if (project.hasProperty('configQa')) {
        neoForge.runs.client.systemProperty 'deepdiving.visualQa', 'false'
        neoForge.runs.client.systemProperty 'deepdiving.configQa', 'true'
    }

    if (project.hasProperty('hudQa')) {
        neoForge.runs.client.systemProperty 'deepdiving.visualQa', 'false'
        neoForge.runs.client.systemProperty 'deepdiving.hudQa', 'true'
    }

    if (project.hasProperty('rc1Qa')) {
        neoForge.runs.client.systemProperty 'deepdiving.visualQa', 'false'
        neoForge.runs.client.systemProperty 'deepdiving.rc1Qa', 'true'
    }

    if (project.hasProperty('shaderQa')) {
        neoForge.runs.client.systemProperty 'deepdiving.visualQa', 'false'
        neoForge.runs.client.systemProperty 'deepdiving.shaderQa', 'true'
    }

    if (project.hasProperty('computerQa')) {
        neoForge.runs.client.systemProperty 'deepdiving.visualQa', 'false'
        neoForge.runs.client.systemProperty 'deepdiving.computerQa', 'true'
    }
}

tasks.register('simulationTest', JavaExec) {
    dependsOn tasks.named('compileQaJava')

    classpath = sourceSets.qa.runtimeClasspath

    mainClass = 'com.diggydwarff.deepdiving.qa.SimulationTest'
}

tasks.named('check') {
    dependsOn tasks.named('simulationTest')
}

tasks.register('verifyServerProbe') {
    dependsOn tasks.named('runServer')

    doLast {
        def report = file('run/server/qa-results.txt')

        if (!project.hasProperty('qa')
                || !report.exists()
                || report.text.contains('FAIL ')
                || !report.text.contains('PASS ')) {
            throw new GradleException('Server probe did not pass; inspect run/server/qa-results.txt.')
        }
    }
}

tasks.register('verifyClientProbe') {
    dependsOn tasks.named('runClient')

    doLast {
        def reportName = clientProbeReportName()
        def report = file("run/client/${reportName}")

        if (!project.hasProperty('qa')
                || !report.exists()
                || report.text.contains('FAIL ')
                || !report.text.contains('PASS ')) {
            throw new GradleException("Client probe did not pass; inspect run/client/${reportName}.")
        }
    }
}

tasks.named('jar') {
    from('LICENSE')
}

tasks.register('verifyIllumination') {
    def library = layout.projectDirectory.file('libs/maven/com/breadres/illuminationapi/1.0/illuminationapi-1.0.jar')
    inputs.file(library)

    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
                .digest(library.asFile.bytes).encodeHex().toString()

        if (digest != 'bb139cd8b37bf60b3e485b761afeae80d973a263e1fd601cce70f190f1bcaa8e') {
            throw new GradleException('Bundled Illumination API does not match the reviewed upstream 1.0 artifact.')
        }
    }
}

tasks.named('jarJar') {
    dependsOn tasks.named('verifyIllumination')
}
